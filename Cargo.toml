[workspace]
resolver = "2"
members = ["src-tauri", "crates/git-core", "crates/github-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rosepetal/gitbranch"
rust-version = "1.85"

[workspace.dependencies]
git-core = { path = "crates/git-core" }
github-api = { path = "crates/github-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tempfile = "3"

# Size-oriented release profile, see https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
