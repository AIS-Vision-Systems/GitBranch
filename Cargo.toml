[workspace]
resolver = "2"
members = ["src-tauri", "crates/git-core", "crates/github-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rosepetal/gitbranch"
rust-version = "1.85"

[workspace.dependencies]
git-core = { path = "crates/git-core" }
github-api = { path = "crates/github-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic subset: the checks that catch real bugs or unreadable code, without the noisy ones.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Product/crate names in prose ("GitBranch") trip this constantly.
doc_markdown = "allow"
# `args`/`argv` side by side is the clearest naming in the runner.
similar_names = "allow"
# Not worth a dependency for a test assertion.
naive_bytecount = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Size-oriented release profile, see https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
