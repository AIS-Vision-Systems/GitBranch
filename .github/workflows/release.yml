# Release build. Owner-triggered: push a `v*` tag. It creates a DRAFT GitHub
# release with the installers, signatures and latest.json; the owner publishes it.
# Required repository secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (the password secret must exist, even if the key has an empty password: set it to an empty value
# only if the key was generated that way). Secrets are never printed.
# Actions are pinned to commit SHAs (the comment after each is the tag the SHA was taken from).
# To bump one: `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (dereference annotated tags with
# `gh api repos/<owner>/<repo>/git/tags/<sha>`), then update the SHA and the comment together.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1 # both jobs add to the same draft release; avoid a create race
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag must match the app version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          echo "tag=$want tauri.conf=$conf package.json=$pkg cargo=$crate"
          [ "$want" = "$conf" ] && [ "$want" = "$pkg" ] && [ "$want" = "$crate" ]             || { echo "::error::tag $GITHUB_REF_NAME does not match all versions"; exit 1; }

      - name: Linux system dependencies (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libdbus-1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # version comes from "packageManager" in package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GitBranch ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
