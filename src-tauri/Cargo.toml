[package]
name = "gitbranch"
description = "Lightweight Git desktop client with a first-class commit graph"
authors = ["Xavi Anguera"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "gitbranch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
git-core.workspace = true
github-api.workspace = true
serde.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
tracing-appender = "0.2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile.workspace = true
git-core = { workspace = true, features = ["fixtures"] }
